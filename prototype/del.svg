<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 836" width="740" height="836" role="img" aria-label="Del, an old man in a flat cap and a wool coat, lit from one side">
  <!-- Two tones only: charcoal ink and the paper. Light comes from the
       viewer's left (the booth window); the right side of his face falls
       into shadow, with the one lit triangle under his eye. -->
  <defs>
    <pattern id="stubble" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <circle cx="2" cy="2" r="1.35" fill="#262626"/>
      <circle cx="6.5" cy="6" r="1" fill="#262626"/>
    </pattern>
    <pattern id="wool" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="2.2" fill="#f2f2f2" opacity="0.18"/>
    </pattern>
    <clipPath id="face">
      <path id="faceShape" d="M252 268 C248 318 246 372 256 420 C264 462 282 500 304 530 C322 556 346 572 372 574 C398 572 420 556 438 530 C460 500 476 462 484 420 C494 372 492 318 488 268 Z"/>
    </clipPath>
  </defs>

  <rect width="740" height="836" fill="#ffffff"/>

  <!-- coat, collar turned up -->
  <path d="M0 836 L0 760 C40 700 120 668 214 640 C256 628 290 612 308 590 L372 640 L436 590 C454 612 488 628 530 640 C624 668 700 700 740 760 L740 836 Z" fill="#262626"/>
  <path d="M0 836 L0 760 C40 700 120 668 214 640 C256 628 290 612 308 590 L372 640 L436 590 C454 612 488 628 530 640 C624 668 700 700 740 760 L740 836 Z" fill="url(#wool)"/>
  <!-- collar edges and a button, drawn in paper -->
  <path d="M300 584 C286 624 250 676 214 712" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M444 584 C458 624 494 676 530 712" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M372 640 L372 836" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
  <circle cx="372" cy="742" r="9" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- neck: lit on the left, shadow on the right -->
  <path d="M318 520 L312 600 C336 624 408 624 432 600 L426 520 Z" fill="#ffffff" stroke="#262626" stroke-width="4"/>
  <path d="M372 540 L372 626 C400 624 420 614 432 600 L426 520 Z" fill="#262626"/>
  <path d="M322 560 C336 572 352 576 366 574 M318 586 C334 598 350 602 364 600" fill="none" stroke="#262626" stroke-width="3" stroke-linecap="round"/>

  <!-- ears -->
  <path d="M256 318 C232 304 214 322 220 356 C226 392 240 418 262 424" fill="#ffffff" stroke="#262626" stroke-width="5" stroke-linejoin="round"/>
  <path d="M248 340 C236 336 232 350 236 366 C240 384 248 396 258 398" fill="none" stroke="#262626" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M484 318 C508 304 526 322 520 356 C514 392 500 418 478 424 Z" fill="#262626"/>

  <!-- face -->
  <use href="#faceShape" fill="#ffffff"/>
  <g clip-path="url(#face)">
    <!-- stubble / short grey beard on the lit side of the jaw -->
    <path d="M250 430 C270 470 300 520 340 552 C360 566 384 568 404 560 L380 610 L240 610 Z" fill="url(#stubble)"/>
    <path d="M300 468 C322 478 348 480 372 476 C396 480 420 478 444 468 L444 510 C420 504 396 504 372 506 C348 504 324 504 300 510 Z" fill="url(#stubble)"/>

    <!-- the shadow side: down the nose, round under it, along the jaw -->
    <path d="M384 262 C390 300 392 330 398 372 C404 404 414 418 404 430 C396 438 384 438 378 446 C388 470 404 492 410 520 C414 544 404 566 388 580 L520 600 L520 262 Z" fill="#262626"/>
    <!-- the lit triangle on the shadow cheek -->
    <path d="M414 388 L456 372 C450 404 438 426 422 440 Z" fill="#ffffff"/>

    <!-- cap brim shadow across the brow -->
    <path d="M240 262 L500 262 L500 300 C446 290 404 294 372 300 C330 294 290 290 240 304 Z" fill="#262626"/>
  </g>
  <use href="#faceShape" fill="none" stroke="#262626" stroke-width="5"/>

  <!-- brow: heavy, low, a little furrowed -->
  <path d="M280 318 C298 304 326 302 352 312" fill="none" stroke="#262626" stroke-width="11" stroke-linecap="round"/>
  <path d="M286 326 C304 318 322 316 340 322" fill="none" stroke="#262626" stroke-width="3" stroke-linecap="round"/>

  <!-- lit eye: deep-set, lid heavy, looking past you -->
  <path d="M292 344 C304 334 326 332 346 342 C334 352 312 356 292 344 Z" fill="#262626"/>
  <circle cx="330" cy="342" r="2.4" fill="#ffffff"/>
  <path d="M288 338 C302 326 330 324 352 338" fill="none" stroke="#262626" stroke-width="4" stroke-linecap="round"/>
  <!-- bags and crow's feet -->
  <path d="M296 360 C312 370 332 370 348 360" fill="none" stroke="#262626" stroke-width="3" stroke-linecap="round"/>
  <path d="M300 374 C316 382 334 382 348 374" fill="none" stroke="#262626" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M284 346 L266 340 M284 352 L266 356 M286 358 L270 368" fill="none" stroke="#262626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- shadow eye: only its glint and lid line show -->
  <path d="M398 342 C414 332 436 332 452 342" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="420" cy="344" r="2.4" fill="#ffffff"/>

  <!-- nose: long, bony, lit edge on the left -->
  <path d="M362 330 C360 368 352 400 346 424 C344 434 352 442 364 440" fill="none" stroke="#262626" stroke-width="4" stroke-linecap="round"/>
  <path d="M348 428 C338 432 336 444 348 448 C356 450 364 446 370 442" fill="none" stroke="#262626" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="360" cy="444" rx="7" ry="4" fill="#262626"/>

  <!-- the folds: nose to mouth, deep -->
  <path d="M338 440 C318 460 310 486 318 508" fill="none" stroke="#262626" stroke-width="5" stroke-linecap="round"/>
  <path d="M300 420 C292 440 290 458 294 474" fill="none" stroke="#262626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- moustache and mouth: set, a little down at the corners -->
  <path d="M326 480 C344 468 362 468 376 474 C388 468 404 470 414 478 C398 486 384 488 376 484 C364 490 342 490 326 480 Z" fill="#262626"/>
  <path d="M332 500 C350 494 368 494 378 498" fill="none" stroke="#262626" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M332 500 L324 508" fill="none" stroke="#262626" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M348 524 C360 530 372 530 382 526" fill="none" stroke="#262626" stroke-width="3" stroke-linecap="round"/>

  <!-- cheek line and jowl on the lit side -->
  <path d="M270 404 C278 430 284 452 282 470" fill="none" stroke="#262626" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M290 516 C300 532 312 544 326 552" fill="none" stroke="#262626" stroke-width="3" stroke-linecap="round"/>

  <!-- flat cap -->
  <path d="M226 270 C214 222 236 170 300 146 C352 128 432 130 486 156 C530 178 540 226 520 268 C470 254 420 250 372 252 C318 252 268 258 226 270 Z" fill="#262626"/>
  <path d="M226 270 C214 222 236 170 300 146 C352 128 432 130 486 156 C530 178 540 226 520 268 C470 254 420 250 372 252 C318 252 268 258 226 270 Z" fill="url(#wool)"/>
  <!-- brim, jutting forward, its lit edge -->
  <path d="M232 266 C282 248 334 240 380 240 C424 240 468 246 512 262 C492 282 438 286 372 284 C306 286 254 284 232 266 Z" fill="#262626"/>
  <path d="M238 264 C290 250 336 244 380 244 C414 244 446 248 476 254" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- the crown seam and a highlight where the light catches the wool -->
  <path d="M300 150 C318 190 330 222 336 250" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <path d="M256 196 C270 172 294 158 322 150" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- grey hair at the temple, under the cap -->
  <path d="M252 270 C248 286 248 300 252 314 M262 272 C258 288 258 300 262 312" fill="none" stroke="#262626" stroke-width="3" stroke-linecap="round"/>
</svg>
